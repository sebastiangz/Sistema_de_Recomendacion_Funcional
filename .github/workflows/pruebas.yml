name: Pruebas
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scipy scikit-learn toolz pytest
      - run: python -m pytest tests/test_funciones_sahid.py -v
